<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Resolvamos con Pólya</title>
<meta name="description" content="Aprende a resolver problemas de matemáticas con el método de Pólya. Para estudiantes de primaria.">
<meta name="theme-color" content="#fff8f1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/logo.webp">
<link rel="apple-touch-icon" href="icons/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pólya">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet">

<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<!-- Pantalla de carga: se muestra hasta que están listos los recursos -->
<div id="splash" class="splash">
  <img class="splash__logo" src="assets/img/logo.webp" alt="Resolvamos con Pólya">
  <div class="splash__barra"><i id="splashBarra"></i></div>
  <p class="splash__texto">Cargando…</p>
</div>

<div class="marco">

  <header class="cabecera" id="cabecera" hidden>
    <img class="cabecera__logo" id="cabeceraLogo" src="assets/img/logo.webp" alt="Resolvamos con Pólya" hidden>
    <div class="cabecera__centro">
      <h1 class="cabecera__titulo" id="tituloVista"></h1>
      <p class="cabecera__sub" id="subVista" hidden></p>
    </div>
    <button class="llamador" id="btnPolya" hidden data-activo="0"
            aria-label="Llamar al profesor Pólya">
      <img src="assets/img/avance-llamada.webp" alt="">
    </button>
    <div class="contador" id="contador" hidden>
      <img src="assets/img/llave.svg" alt="Llaves"><span id="totalLlaves">0</span>
    </div>
  </header>

  <main id="vista" class="vista" tabindex="-1"></main>

  <footer class="pie-fijo" id="pieFijo" hidden>
    <button class="redondo" id="btnAtras" aria-label="Volver">
      <span class="material-symbols-rounded">arrow_back</span>
    </button>
    <button class="redondo" id="btnInfo" aria-label="Cómo se usa">
      <span class="material-symbols-rounded">help</span>
    </button>
  </footer>

</div>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
  <div class="modal__caja" id="modalCaja"></div>
</div>

<div id="instalar" class="instalar" hidden>
  <p>Instala la app para usarla sin internet</p>
  <button class="btn btn--pequeno" id="btnInstalar">Instalar</button>
  <button class="redondo redondo--mini" id="btnNoInstalar" aria-label="Ahora no">
    <span class="material-symbols-rounded">close</span>
  </button>
</div>

<script src="js/datos.js"></script>
<script src="js/sonido.js"></script>
<script src="js/progreso.js"></script>
<script src="js/app.js"></script>
</body>
</html>
